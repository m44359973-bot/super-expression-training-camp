<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超级表达训练营</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="scene-canvas" aria-hidden="true"></canvas>

  <!-- 洋红闪烁边框 -->
  <div class="glow-border"></div>

  <!-- 主布局：三列 -->
  <div class="layout">
    <!-- 左栏：表达分析 -->
    <aside class="panel-left">
      <div class="panel-heading">
        <div class="panel-title">表达分析</div>
        <div class="panel-caption">实时词语信号</div>
      </div>
      <div class="stat-row">
        <span class="stat-label">笼统词</span>
        <span id="stat-vague" class="stat-value stat-red">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">填充词</span>
        <span id="stat-fillers" class="stat-value stat-orange">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">犹豫词</span>
        <span id="stat-hedges" class="stat-value stat-yellow">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">表达密度</span>
        <span id="stat-density" class="stat-value stat-green">--</span>
      </div>
      <div class="mode-section">
        <div class="mode-label">训练模式</div>
        <div class="mode-switch" role="group" aria-label="练习模式">
          <button id="btn-mode-solo" class="mode-option active" type="button">独自表达</button>
          <button id="btn-mode-dialogue" class="mode-option" type="button">AI 对话</button>
          <button id="btn-mode-challenge" class="mode-option" type="button">挑战模式</button>
        </div>
        <div id="mode-description" class="mode-description">你说，我帮你记录和分析</div>
      </div>
      <div class="challenge-history">
        <div class="font-control-header"><span>挑战记录</span><output id="challenge-record-count">0 次</output></div>
        <div class="challenge-best">最高分 <strong id="challenge-best-score">--</strong></div>
        <div id="challenge-history-list" class="challenge-history-list"></div>
      </div>
      <div class="font-control">
        <div class="font-control-header">
          <span>字幕字号</span>
          <output id="font-size-value" for="font-size-slider">25px</output>
        </div>
        <input id="font-size-slider" class="font-size-slider" type="range" min="18" max="36" value="25" step="1" aria-label="调整字幕字号">
      </div>
      <div class="font-family-control">
        <label class="font-control-header" for="font-family-select"><span>字幕字体</span></label>
        <select id="font-family-select" class="font-family-select" aria-label="选择字幕字体">
          <option value="system">系统黑体</option>
          <option value="rounded">圆润黑体</option>
          <option value="serif">清晰宋体</option>
          <option value="mono">等宽字体</option>
        </select>
      </div>
    </aside>

    <!-- 中间：主内容区 -->
    <main class="main-area">
      <!-- 顶部栏 -->
      <div class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark">口</div>
          <div>
            <div class="app-kicker">表达训练工作台</div>
            <span class="app-title">超级表达训练营</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="session-status"><span class="status-dot"></span><span id="timer" class="timer">00:00</span></div>
          <button id="btn-prompt-editor" class="btn-icon" title="训练规则">🎯</button>
          <button id="btn-settings" class="btn-icon" title="设置">⚙️</button>
        </div>
      </div>

      <section id="challenge-panel" class="challenge-panel hidden" aria-live="polite">
        <div class="challenge-panel-label">本轮挑战 · 60 秒</div>
        <div id="challenge-question" class="challenge-question"></div>
        <button id="btn-change-question" class="btn-sm challenge-change" type="button">换一道题</button>
      </section>

      <!-- 字幕区顶部工具栏 -->
      <div class="subtitle-topbar">
        <div class="subtitle-topbar-right">
          <button id="btn-copy-text" class="btn-sm hidden" title="复制原文">📋 复制</button>
          <button id="btn-save-text" class="btn-sm hidden" title="保存原文">💾 保存</button>
          <button id="btn-clear" class="btn-sm hidden" title="清空">🗑️ 清空</button>
        </div>
      </div>

      <!-- 字幕滚动区 -->
      <div id="subtitle-scroll" class="subtitle-scroll">
        <div id="subtitle-container" class="subtitle-container">
          <div class="subtitle-line hint">点击下方按钮开始说话</div>
        </div>
      </div>

      <!-- 底部按钮（只保留核心操作） -->
      <div class="action-bar">
        <button id="btn-start" class="btn-main btn-start">
          <span class="btn-icon-inner">🎤</span>
          <span class="btn-label">开始录制</span>
        </button>
        <button id="btn-paste" class="btn-main btn-paste-action" type="button">
          <span class="btn-icon-inner">📋</span>
          <span class="btn-label">粘贴逐字稿</span>
        </button>
        <button id="btn-pause" class="btn-main btn-pause hidden">
          <span class="btn-icon-inner">⏸️</span>
          <span class="btn-label">暂停</span>
        </button>
        <button id="btn-resume" class="btn-main btn-resume hidden">
          <span class="btn-icon-inner">▶️</span>
          <span class="btn-label">继续</span>
        </button>
        <button id="btn-stop" class="btn-main btn-stop hidden">
          <span class="btn-icon-inner">⏹️</span>
          <span class="btn-label">结束</span>
        </button>
        <button id="btn-report" class="btn-main btn-report hidden">
          <span class="btn-icon-inner">📋</span>
          <span class="btn-label">生成报告</span>
        </button>
      </div>
    </main>

    <!-- 右栏：实时反馈 -->
    <aside class="panel-right">
      <div class="panel-heading">
        <div class="panel-title">实时反馈</div>
        <div class="panel-caption">捕捉值得调整的表达</div>
      </div>

      <div id="feedback-content" class="feedback-content">
        <!-- 实时反馈内容 -->
      </div>
    </aside>
  </div>

  <!-- 耳机DJ少女 icon -->
  <div class="girl-icon">
    <svg width="44" height="44" viewBox="0 0 70 70" fill="none">
      <path d="M16 32 Q16 14 35 12 Q54 14 54 32" stroke="#E5007E" stroke-width="2.5" fill="none"/>
      <rect x="12" y="30" width="7" height="12" rx="3" fill="#E5007E" opacity="0.6"/>
      <rect x="51" y="30" width="7" height="12" rx="3" fill="#E5007E" opacity="0.6"/>
      <circle cx="35" cy="38" r="14" stroke="#E5007E" stroke-width="2" fill="none"/>
      <path d="M28 36 Q32 33 36 36" stroke="#E5007E" stroke-width="1.5" fill="none"/>
      <path d="M38 36 Q41 34 44 37" stroke="#E5007E" stroke-width="1.5" fill="none"/>
      <circle cx="32" cy="35.5" r="1.2" fill="#E5007E"/>
      <path d="M31 43 Q35 46 39 43" stroke="#E5007E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 粘贴逐字稿弹窗 -->
  <div id="paste-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📋 粘贴逐字稿</h2>
        <button id="btn-close-paste" class="btn-close">×</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:12px;">
        <p style="color:#888;font-size:13px;">把逐字稿粘贴进来，我帮你分析</p>
        <textarea id="paste-textarea" placeholder="在这里粘贴文字..." style="flex:1;min-height:300px;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:16px;color:#fff;font-size:14px;line-height:1.8;resize:none;font-family:inherit;"></textarea>
        <button id="btn-analyze-paste" style="background:#E5007E;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;align-self:flex-end;">🔍 开始分析</button>
      </div>
    </div>
  </div>

  <!-- 报告弹窗 -->
  <div id="report-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📋 表达分析报告</h2>
        <div class="modal-header-actions">
          <button id="btn-copy-report" class="btn-sm">📋 复制全文</button>
          <button id="btn-close-report" class="btn-close">×</button>
        </div>
      </div>
      <div id="report-body" class="modal-body">
      </div>
    </div>
  </div>

  <div id="challenge-result-modal" class="modal hidden">
    <div class="modal-content challenge-result-content">
      <div class="modal-header">
        <h2>挑战完成</h2>
        <button id="btn-close-challenge-result" class="btn-close" type="button">×</button>
      </div>
      <div id="challenge-result-body" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
